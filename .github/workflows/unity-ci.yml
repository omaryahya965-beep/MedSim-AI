# Unity in the cloud (GameCI): compiles the project, runs the Unity Test Runner (EditMode + PlayMode),
# generates the surgery scenes and builds a Windows desktop exe — no local Unity install needed.
# One-time setup (repo Settings → Secrets and variables → Actions):
#   UNITY_LICENSE  = full contents of your Unity_lic.ulf (Windows: C:\ProgramData\Unity\Unity_lic.ulf,
#                    created after signing in to Unity Hub once with a Personal licence)
#   UNITY_EMAIL    = Unity account email      UNITY_PASSWORD = Unity account password
name: Unity CI
on:
  workflow_dispatch:
  push:
    branches: [feature/surgery-complete, feature/surgery-ai-integration]
  pull_request:
    branches: [feature/surgery-complete]
env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
jobs:
  off-unity:
    name: Off-Unity tests (C# + proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: bash Tools/OffUnityTests/run-all.sh

  unity-tests:
    name: Unity compile + Test Runner
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: false, android: true, dotnet: false, haskell: true, large-packages: false, docker-images: false, swap-storage: true }
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-tests-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          unityVersion: 6000.3.29f1
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unity-test-results, path: ${{ steps.tests.outputs.artifactsPath }} }

  desktop-build:
    name: Surgery scenes + Windows desktop build
    runs-on: ubuntu-latest
    needs: unity-tests
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: false, android: true, dotnet: false, haskell: true, large-packages: false, docker-images: false, swap-storage: true }
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-win-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-win-
      - uses: game-ci/unity-builder@v4
        with:
          unityVersion: 6000.3.29f1
          targetPlatform: StandaloneWindows64
          buildMethod: MedSimAI.Surgery.EditorTools.MedSimSurgeryCI.BuildDesktop
          buildName: MedSimAI
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MedSimAI_Surgery_Desktop
          path: |
            build
            Docs/Surgery/Integration/LAST_SCENE_BUILD.txt
