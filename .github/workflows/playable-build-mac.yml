# macOS version of the playable test build (desktop mode, keyboard + mouse). Never pushes or merges anything.
# Download: Actions → this run → Artifacts → MedSimAI_Mac → unzip → double-click MedSimAI_Mac.tar.gz → right-click MedSimAI.app → Open
name: Playable macOS build
on:
  workflow_dispatch:
  push:
    branches: [test/playable-build]
permissions:
  contents: read
jobs:
  build-mac:
    runs-on: windows-latest   # cross-builds the Mac app (macOS runners failed to install Unity Hub)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-maccross-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-maccross-
            Library-playable-
      - uses: buildalon/unity-setup@v2
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          build-targets: StandaloneWindows64
      - uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
      - name: Install Mac Build Support (Mono) for the Windows editor
        shell: bash
        run: |
          "$UNITY_HUB_PATH" -- --headless install-modules --version 6000.3.29f1 -m mac-mono --childModules 2>&1 | tail -20
          ls "$(dirname "$UNITY_EDITOR_PATH")/Data/PlaybackEngines" || true
      - name: Build macOS app (hospital + clinical + surgical rooms)
        shell: bash
        run: |
          "$UNITY_EDITOR_PATH" -batchmode -nographics -quit -projectPath "${UNITY_PROJECT_PATH:-$GITHUB_WORKSPACE}" -buildTarget StandaloneOSX \
            -executeMethod MedSimAI.Hospital.EditorTools.HospitalBuildCI.BuildMac -logFile unity-build-mac.log || status=$?
          grep -E "HospitalBuildCI|error CS" unity-build-mac.log | grep -v "grep -E" | head -40 || true
          exit ${status:-0}
      - name: Package (tar with executable bits set, since NTFS has none)
        shell: python
        run: |
          import os, tarfile
          root = "build/MedSimAI_Mac"; app = os.path.join(root, "MedSimAI.app")
          def fix(ti):
              if ti.isdir() or "/Contents/MacOS/" in ti.name or ti.name.endswith((".dylib", ".bundle")) or "/MacOS/" in ti.name: ti.mode = 0o755
              else: ti.mode = 0o644
              return ti
          with tarfile.open(os.path.join(root, "MedSimAI_Mac.tar.gz"), "w:gz") as t: t.add(app, arcname="MedSimAI.app", filter=fix)
          open(os.path.join(root, "HOW_TO_OPEN.txt"), "w").write("MedSim AI - TEST build (DRAFT, not clinically validated)\n1) Double-click MedSimAI_Mac.tar.gz\n2) Right-click MedSimAI.app > Open > Open (first time only)\n   If macOS refuses: System Settings > Privacy & Security > Open Anyway\n   Or in Terminal: xattr -dr com.apple.quarantine ~/Downloads/MedSimAI.app\n3) Allow the microphone when asked (voice needs the MedSim AI proxy; without it: text only)\n")
          print("packed", os.path.getsize(os.path.join(root, "MedSimAI_Mac.tar.gz")) // 1048576, "MB")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MedSimAI_Mac
          path: |
            build/MedSimAI_Mac/MedSimAI_Mac.tar.gz
            build/MedSimAI_Mac/HOW_TO_OPEN.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unity-build-log-mac, path: unity-build-mac.log }
